spring:
  application:
    name: minishop-server
  config:
    import: optional:file:./config/database.properties,optional:file:./config/auth.properties,optional:file:./config/mail.properties
  datasource:
    url: jdbc:postgresql://localhost:5432/minishop?currentSchema=minishop
    username: postgres
    password: ""
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: minishop
  sql:
    init:
      mode: never
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

app:
  auth:
    issuer: minishop-server
    access-token-minutes: 15
    refresh-token-days: 30
    verification-code-minutes: 10
    resend-cooldown-seconds: 60
    max-verification-attempts: 5
